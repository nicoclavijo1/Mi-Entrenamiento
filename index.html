<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

<body>
<title>Mi entrenamiento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caladea:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Concepto: panel de control sobre cuadrícula tenue, igual que Mi rendimiento. Midnight / Ice White de fondo.
   Rojo de marca #EF4444 fijo en títulos, botones y acentos (claro u oscuro). Verde solo = mejora, gris = igual. */
:root{
  --bg:#111827;--bg2:#0B1220;--bg3:#172033;--line:#374151;
  --tx:#F9FAFB;--tx2:#D1D5DB;--mut:#9CA3AF;
  --ac:#EF4444;--act:#F87171;--acs:rgba(239,68,68,.18);
  --red:#EF4444;--grn:#22C55E;--grnt:#4ADE80;--org:#F59E0B;--blu:#3B82F6;--pur:#A855F7;
  --onac:#FFFFFF;
  --grid:rgba(55,65,81,.35);--sh:0 12px 28px -16px rgba(0,0,0,.7);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Cambria,Caladea,Georgia,serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F9FAFB;--bg2:#FFFFFF;--bg3:#F1F5F9;--line:#D1D5DB;
    --tx:#111827;--tx2:#374151;--mut:#4B5563;
    --ac:#DC2626;--act:#B91C1C;--acs:rgba(220,38,38,.12);
    --grnt:#15803D;
    --grid:rgba(17,24,39,.06);--sh:0 12px 28px -18px rgba(17,24,39,.35);color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F9FAFB;--bg2:#FFFFFF;--bg3:#F1F5F9;--line:#D1D5DB;
  --tx:#111827;--tx2:#374151;--mut:#4B5563;
  --ac:#DC2626;--act:#B91C1C;--acs:rgba(220,38,38,.12);
  --grnt:#15803D;
  --grid:rgba(17,24,39,.06);--sh:0 12px 28px -18px rgba(17,24,39,.35);color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background-color:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;background-position:-1px -1px;
  padding-block:14px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:680px;margin-inline:auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
h1,h2,h3,p{margin:0}
.tab{font-variant-numeric:tabular-nums}
.sm{font-size:13px}.mut{color:var(--mut)}
.sec{margin-top:28px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.eyebrow::before{content:"";flex:none;width:16px;height:3px;border-radius:2px;background:var(--ac)}
.big{font-size:34px;line-height:1.04;font-weight:800;letter-spacing:-.03em;text-transform:uppercase;margin-top:8px;color:var(--act)}
.big::after{content:"";display:block;width:48px;height:4px;border-radius:2px;background:var(--ac);margin-top:14px}
.h2{font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.025em;color:var(--act)}
.lede{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--tx2);margin-top:10px;max-width:60ch}
/* cabecera */
.top{display:flex;align-items:center;gap:12px;padding-bottom:16px}
.who{min-width:0;flex:1;display:grid;gap:1px}
.who .g{font-size:13px;font-weight:600;color:var(--mut);line-height:1.25}
.who .n{color:var(--act);font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.who{display:flex;align-items:center;gap:12px;min-width:0;flex:1;background:none;border:0;padding:0;text-align:left;border-radius:14px}
.who .tx{min-width:0;display:grid;gap:1px}
.who .n.ask{font-size:16px;color:var(--act);text-decoration:underline;text-underline-offset:3px}
.av{display:grid;place-items:center;flex:none;border-radius:50%;border:2px solid var(--ac);overflow:hidden;background:var(--bg3);color:var(--act);font-weight:800}
.av img{display:block;width:100%;height:100%;object-fit:cover}
.avs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.avp{background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:12px 6px;display:grid;justify-items:center;gap:8px;min-height:44px;color:var(--tx)}
.avp.on{border-color:var(--ac);background:var(--acs)}
.avp .sm{font-weight:600;text-align:center}
.avp.on .sm{font-weight:800}
.ck svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--act)}
input.na{min-height:48px;font-size:15px;word-break:normal}
.sw{position:relative;width:68px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg3);padding:0;flex:none}
.sw .k{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;background:var(--ac);transition:transform .2s}
.sw[aria-checked="true"] .k{transform:translateX(28px)}
.sw svg{position:absolute;top:11px;width:16px;height:16px;color:var(--mut)}
.sw .s1{left:11px}.sw .s2{left:39px}
.sw[aria-checked="false"] .s1,.sw[aria-checked="true"] .s2{color:#fff}
/* piezas */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:var(--onac);font-weight:800;min-height:48px;box-shadow:0 10px 20px -12px var(--ac)}
.btn.g{background:var(--bg3);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.sm{min-height:40px;padding:8px 13px;font-size:13px;box-shadow:none}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;padding:10px 0;font-size:13px}
.del{background:none;border:0;color:var(--red);font-weight:700;font-size:13px;padding:8px 0 8px 10px;min-height:40px}
.chip{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.on{color:var(--act);border-color:var(--ac);background:var(--acs)}
.pill{display:inline-block;font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px;color:#fff;background:var(--ac);white-space:nowrap}
.pill.ok{background:var(--grn);color:#06240F}
.pill.eq{background:var(--bg3);color:var(--mut);border:1px solid var(--line)}
.banner{border:1.5px solid var(--ac);border-radius:20px;padding:18px;background:var(--bg2);display:grid;gap:10px;box-shadow:var(--sh)}
.banner b{font-weight:800;font-size:18px;letter-spacing:-.01em}
/* lista de ejercicios */
.exl{margin-top:14px;display:grid}
.exl .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.exl .it:first-child{border-top:0;padding-top:2px}
.exl .num{flex:none;width:28px;height:28px;border-radius:9px;background:var(--bg3);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mut)}
.exl .nm{flex:1;min-width:0;font-weight:700}
.exl .tp{font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap}
/* entreno */
.prog{display:flex;gap:6px;margin-bottom:16px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--ac)}
.ph{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border:2px dashed var(--line);border-radius:18px;background:var(--bg3);display:grid;place-items:center;text-align:center;padding:16px;color:var(--mut);gap:6px}
.ph.tiene{border:1px solid var(--line);border-style:solid;padding:0;overflow:hidden;background:var(--bg3)}
.ph.tiene img{width:100%;height:100%;object-fit:cover;display:block;border-radius:16px}
.ph svg{width:30px;height:30px}
.ph span{font-size:13px;line-height:1.35;max-width:30ch}
.topbox{display:flex;gap:10px;margin-top:16px}
.topbox .b{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg3)}
.topbox .b.hot{border-color:var(--ac);background:var(--acs)}
.topbox .b span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.topbox .b b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.serie{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.serie:first-of-type{border-top:0}
.serie .lb{display:grid;gap:1px;min-width:86px}
.serie .lb b{font-weight:800;font-size:15px}
.serie .lb span{font-size:11px;color:var(--mut);font-weight:600}
.stp{display:flex;align-items:center;gap:8px;justify-content:center}
.stp button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);color:var(--tx);font-size:22px;font-weight:800;display:grid;place-items:center;line-height:1}
.stp input{width:72px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp input.bad{border-color:var(--red);color:var(--act)}
.err{margin-top:12px;border:1px solid var(--red);background:var(--acs);border-radius:14px;padding:11px 13px;font-size:13px;font-weight:600;color:var(--act)}
.foot{margin-top:18px;display:grid;gap:10px}
/* resumen */
.cmp{border-top:1px solid var(--line);padding:13px 0}
.cmp:first-of-type{border-top:0}
.cmp .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cmp .hd b{font-weight:800;font-size:16px}
.cmp .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:9px}
.cmp .vs .c{border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0;background:var(--bg3)}
.cmp .vs .c.now{border-color:var(--ac);background:var(--acs)}
.cmp .vs .c span{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.cmp .vs .c b{display:block;font-size:17px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.cmp .vs .c small{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-top:2px}
.cmp .vs .ar{color:var(--mut);font-size:18px;font-weight:800}
/* calendario */
.cal{margin-top:16px}
.calh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.calh b{font-weight:800;font-size:17px;text-transform:capitalize}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);color:var(--tx);display:grid;place-items:center;flex:none}
.ib svg{width:18px;height:18px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}
.dh{text-align:center;font-size:11px;font-weight:700;color:var(--mut);padding-bottom:2px}
.dc{aspect-ratio:1;border-radius:11px;border:1px solid transparent;background:transparent;display:grid;place-items:center;gap:1px;padding:2px;min-width:0}
.dc .d{font-size:12px;font-weight:700;color:var(--mut);line-height:1;font-variant-numeric:tabular-nums}
.dc .m{font-size:15px;font-weight:800;line-height:1}
.dc.train{background:var(--bg3);border-color:var(--line)}
.dc.done{background:rgba(34,197,94,.16);border-color:var(--grn)}
.dc.done .m{color:var(--grnt)}
.dc.miss{background:var(--acs);border-color:var(--ac)}
.dc.miss .m{color:var(--act)}
.dc.today{outline:2px solid var(--ac);outline-offset:1px}
.dc.out{opacity:.3}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:14px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.kpi{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--bg2);border-radius:18px;padding:16px 14px 14px;box-shadow:var(--sh)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--kc,var(--ac))}
.kpi.k2{--kc:var(--grn)}.kpi.k3{--kc:var(--org)}
.kpi b{display:block;font-size:28px;line-height:1;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;color:var(--mut);font-weight:600;letter-spacing:0}
.kpi p{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.35}
/* récords */
.rec{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;color:var(--tx);text-align:left;min-height:56px}
.rec .xmc svg{width:16px}
.rec:active{background:var(--acs)}
.rec:first-of-type{border-top:0}
.rec .nm{flex:1;min-width:0;font-weight:700}
.rec .nm small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.rec .vl{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--act)}
.rec .vl small{color:var(--mut);font-weight:600;font-size:11px;display:block;text-align:right}
/* ajustes */
textarea.na,input.na{width:100%;resize:none;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:96px;font:inherit;font-size:12px;color:var(--tx);line-height:1.4;word-break:break-all}
.seg{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 10px;min-height:42px;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--ac);color:var(--onac)}
.tools{display:flex;gap:8px;align-items:center}
.ib2{width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);color:var(--tx);display:grid;place-items:center;flex:none}
.ib2 svg{width:20px;height:20px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(3,7,18,.66);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:680px;max-height:92dvh;overflow-y:auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 16px}
.xmenu{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.xmi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);min-height:68px;color:var(--tx)}
.xmic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--acs);color:var(--act);display:grid;place-items:center}
.xmic svg{width:22px;height:22px}
.xmt{flex:1;min-width:0;display:flex;flex-direction:column}
.xmt b{font-size:16px;font-weight:800}
.xmt span{font-size:12.5px;color:var(--mut);margin-top:2px}
.xmc{flex:none;color:var(--mut);display:grid}
.xmc svg{width:18px;height:18px}
.xbk{display:flex;align-items:center;gap:10px;min-width:0}
.xbk .h2{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,520px);
  background:var(--bg3);border:1px solid var(--ac);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:700;color:var(--tx);
  box-shadow:0 8px 24px rgba(0,0,0,.35)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg2);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav div{max-width:680px;margin:auto;display:flex;gap:6px}
.nav button{position:relative;flex:1;border:0;background:none;min-height:50px;border-radius:12px;font-weight:700;font-size:11px;color:var(--mut);display:grid;place-items:center;gap:2px}
.nav button.on{background:var(--acs);color:var(--act)}
.nav button.on::after{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.nav button svg{width:22px;height:22px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top" id="top"></header>

  <main id="view"></main>
</div>

<nav class="nav">
  <div>
    <button data-tab="hoy" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"></path></svg>Hoy</button>
    <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Calendario</button>
    <button data-tab="rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v5a7 7 0 0 1-14 0z"></path><path d="M5 6H3v2a3 3 0 0 0 3 3M19 6h2v2a3 3 0 0 1-3 3M9 20h6M12 16v4"></path></svg>Récords</button>
    
  </div>
</nav>

var DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

/* ---------- estado ---------- */
var KEY = "nc-entrenamiento-v1";
var S = {theme:null, log:{}, prof:{av:1, name:""}};   // log: "YYYY-MM-DD" -> {dow, ex:{id:[reps...]}}
var tab = "hoy";
var calRef = new Date();
var W = null;                   // entreno en curso

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var o = JSON.parse(raw); if(o && typeof o === "object"){ S.theme = o.theme || null; S.log = o.log || {}; if(o.prof) S.prof = {av:o.prof.av || 1, name:o.prof.name || ""}; } }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({theme:S.theme, log:S.log, prof:S.prof})); }catch(e){}
}

/* ---------- fechas ---------- */
function ymd(d){
  var m = d.getMonth()+1, dd = d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;
}
function hoyISO(){ return ymd(new Date()); }
function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- lógica Kaizen ---------- */
function unidad(ex){ return ex.u === "seg" ? "seg" : "reps"; }
function exInfo(id){
  for(var k in ROUTINES){
    var l = ROUTINES[k].ex;
    for(var i=0;i<l.length;i++){ if(l[i].id === id) return l[i]; }
  }
  return {id:id, n:id};
}
/* TOPE: mejor marca histórica por número de serie */
function tope(id){
  var best = [];
  for(var f in S.log){
    var s = S.log[f].ex && S.log[f].ex[id];
    if(!s) continue;
    for(var i=0;i<s.length;i++){ if(best[i] == null || s[i] > best[i]) best[i] = s[i]; }
  }
  return best;
}
/* última sesión registrada de ese ejercicio */
function ultima(id, exceptFecha){
  var mejorF = null;
  for(var f in S.log){
    if(f === exceptFecha) continue;
    if(!S.log[f].ex || !S.log[f].ex[id]) continue;
    if(mejorF === null || f > mejorF) mejorF = f;
  }
  return mejorF ? {fecha:mejorF, series:S.log[f = mejorF].ex[id]} : null;
}
function suma(a){ var t=0; for(var i=0;i<(a?a.length:0);i++) t += a[i]||0; return t; }

/* ---------- render ---------- */
var view = document.getElementById("view");
function render(){
  if(W) return renderEntreno();
  if(tab === "hoy") return renderHoy();
  if(tab === "cal") return renderCal();
  renderRec();
}

/* --- Hoy --- */
function renderHoy(){
  var hoy = new Date(), iso = hoyISO(), dow = hoy.getDay();
  var r = ROUTINES[dow];
  var hecho = !!S.log[iso];
  var h = '';
  h += '<p class="eyebrow">'+DIAS[dow]+' '+hoy.getDate()+' de '+MESES[hoy.getMonth()]+'</p>';

  if(r){
    h += '<h1 class="big">'+esc(r.titulo)+'</h1>';
    if(hecho){
      h += '<div class="banner" style="margin-top:18px"><b>Rutina completada</b><p class="sm mut">Ya registraste el entrenamiento de hoy. Los topes quedaron actualizados.</p>'
         + '<button class="btn g" data-go="resumen" data-f="'+iso+'">Ver resumen de hoy</button></div>';
    }else{
      h += '<p class="lede">Cinco ejercicios. En cada uno registras tus series y nunca puedes bajar del tope anterior: ese es el principio Kaizen.</p>';
    }
    h += '<div class="card sec"><div class="row"><h2 class="h2">Ejercicios</h2><span class="chip on">'+r.ex.length+' en total</span></div><div class="exl">';
    for(var i=0;i<r.ex.length;i++){
      var t = tope(r.ex[i].id), u = unidad(r.ex[i]);
      h += '<div class="it"><span class="num">'+(i+1)+'</span><span class="nm">'+esc(r.ex[i].n)+'</span>'
         + '<span class="tp">'+(t.length ? 'Tope '+t.join(" · ")+' '+u : 'Sin tope aún')+'</span></div>';
    }
    h += '</div></div>';
    if(!hecho) h += '<div class="foot"><button class="btn full" data-start="'+dow+'">Empezar rutina</button></div>';
  }else{
    h += '<h1 class="big">Día de descanso</h1>';
    h += '<p class="lede">Hoy no toca rutina. Entrenas martes, miércoles, jueves, sábado y domingo.</p>';
    h += '<div class="card sec"><h2 class="h2">Entrenar otra rutina</h2><p class="sm mut" style="margin-top:6px">Si quieres adelantar o recuperar una sesión, elige cuál hacer hoy.</p><div class="exl">';
    var ords = [2,3,4,6,0];
    for(var j=0;j<ords.length;j++){
      var k = ords[j];
      h += '<div class="it"><span class="num">'+ROUTINES[k].dia.charAt(0)+'</span><span class="nm">'+esc(ROUTINES[k].titulo)+'<br><span class="sm mut">'+ROUTINES[k].dia+'</span></span>'
         + '<button class="btn sm" data-start="'+k+'">Hacer</button></div>';
    }
    h += '</div></div>';
  }

  /* progreso rápido de la semana */
  h += bloqueSemana();
  view.innerHTML = h;
}

function bloqueSemana(){
  var hoy = new Date();
  var lunes = new Date(hoy); var dow = hoy.getDay();
  lunes.setDate(hoy.getDate() - ((dow+6)%7));
  var hechas = 0, toca = 0;
  for(var i=0;i<7;i++){
    var d = new Date(lunes); d.setDate(lunes.getDate()+i);
    if(!ROUTINES[d.getDay()]) continue;
    toca++;
    if(S.log[ymd(d)]) hechas++;
  }
  return '<div class="card sec"><div class="row"><h2 class="h2">Esta semana</h2><span class="chip">'+hechas+' de '+toca+'</span></div>'
    + '<div class="prog" style="margin-top:14px;margin-bottom:0">'+(function(){var s="";for(var i=0;i<toca;i++) s += '<i class="'+(i<hechas?"on":"")+'"></i>'; return s;})()+'</div></div>';
}

/* --- Entreno --- */
function startEntreno(dow){
  var r = ROUTINES[dow];
  var series = {};
  for(var i=0;i<r.ex.length;i++){
    var t = tope(r.ex[i].id);
    series[r.ex[i].id] = t.length ? t.slice() : [0];
  }
  W = {dow:dow, i:0, series:series, err:"", fin:false, fecha:hoyISO()};
  render();
}

function renderEntreno(){
  if(W.fin) return renderResumen(W.fecha, true);
  var r = ROUTINES[W.dow], ex = r.ex[W.i], u = unidad(ex);
  var t = tope(ex.id), ult = ultima(ex.id, W.fecha);
  var vals = W.series[ex.id];

  var h = '';
  h += '<div class="prog">'+(function(){var s="";for(var i=0;i<r.ex.length;i++) s += '<i class="'+(i<=W.i?"on":"")+'"></i>'; return s;})()+'</div>';
  h += '<p class="eyebrow">'+esc(r.titulo)+' · ejercicio '+(W.i+1)+' de '+r.ex.length+'</p>';
  h += '<h1 class="big">'+esc(ex.n)+'</h1>';

  h += '<div class="card sec">';
  if(ex.img){
    h += '<div class="ph tiene"><img src="'+ex.img+'" alt="Cómo se hace: '+esc(ex.n)+'"></div>';
  } else {
    h += '<div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M3 17l5-4 4 3 3-2 6 5"></path></svg>'
       + '<span>Aquí va la imagen de cómo se hace el ejercicio</span></div>';
  }

  h += '<div class="topbox">';
  h += '<div class="b hot"><span>Tope actual</span><b class="tab">'+(t.length ? t.join(" · ") : "—")+'</b><span style="text-transform:none;letter-spacing:0;font-weight:600">'+u+' por serie</span></div>';
  h += '<div class="b"><span>Última vez</span><b class="tab">'+(ult ? ult.series.join(" · ") : "—")+'</b><span style="text-transform:none;letter-spacing:0;font-weight:600">'+(ult ? fechaCorta(ult.fecha) : "primera vez")+'</span></div>';
  h += '</div>';

  h += '<div style="margin-top:16px">';
  for(var i=0;i<vals.length;i++){
    var min = t[i] != null ? t[i] : 0;
    h += '<div class="serie"><div class="lb"><b>Serie '+(i+1)+'</b><span>'+(min>0 ? 'mínimo '+min+' '+u : 'libre')+'</span></div>'
       + '<div class="stp"><button type="button" data-step="-1" data-i="'+i+'" aria-label="Quitar uno">−</button>'
       + '<input type="number" inputmode="numeric" id="s'+i+'" value="'+vals[i]+'" min="'+min+'" step="1" data-i="'+i+'" aria-label="Serie '+(i+1)+', '+u+'">'
       + '<button type="button" data-step="1" data-i="'+i+'" aria-label="Sumar uno">+</button></div>'
       + (vals.length>1 && i===vals.length-1 ? '<button class="del" data-rm="'+i+'">Quitar</button>' : '<span></span>')
       + '</div>';
  }
  h += '</div>';
  h += '<button class="btn g sm" data-add="1" style="margin-top:12px">+ Agregar serie</button>';
  if(W.err) h += '<div class="err">'+esc(W.err)+'</div>';
  h += '</div>';

  h += '<div class="foot">';
  h += '<button class="btn full" data-next="1">'+(W.i === r.ex.length-1 ? "Terminar entrenamiento" : "Continuar")+'</button>';
  h += (W.i > 0 ? '<button class="btn g full" data-prev="1">Volver al anterior</button>' : '<button class="link" data-cancel="1">Cancelar entrenamiento</button>');
  h += '</div>';
  view.innerHTML = h;
}

function fechaCorta(iso){
  var d = parseISO(iso);
  return d.getDate()+" "+MESES[d.getMonth()].slice(0,3);
}

function validarYGuardarPaso(){
  var r = ROUTINES[W.dow], ex = r.ex[W.i], u = unidad(ex), t = tope(ex.id);
  var vals = W.series[ex.id], nuevos = [];
  for(var i=0;i<vals.length;i++){
    var el = document.getElementById("s"+i);
    var v = el ? parseInt(el.value, 10) : vals[i];
    if(isNaN(v) || v < 0) v = 0;
    nuevos.push(v);
  }
  W.series[ex.id] = nuevos;
  for(var j=0;j<nuevos.length;j++){
    var min = t[j] != null ? t[j] : 0;
    if(nuevos[j] < min){
      W.err = "La serie "+(j+1)+" no puede bajar del tope: mínimo "+min+" "+u+". Kaizen solo va hacia arriba.";
      return false;
    }
    if(nuevos[j] <= 0){
      W.err = "La serie "+(j+1)+" está en cero. Registra al menos 1 "+(u === "seg" ? "segundo" : "repetición")+" o quita la serie.";
      return false;
    }
  }
  W.err = "";
  return true;
}

function terminar(){
  var r = ROUTINES[W.dow];
  var ex = {};
  for(var i=0;i<r.ex.length;i++) ex[r.ex[i].id] = W.series[r.ex[i].id];
  S.log[W.fecha] = {dow:W.dow, ex:ex};
  save();
  W.fin = true;
  render();
}

/* --- Resumen --- */
function renderResumen(fecha, desdeEntreno){
  var reg = S.log[fecha];
  if(!reg){ W = null; tab = "hoy"; return render(); }
  var r = ROUTINES[reg.dow];
  var h = '';
  h += '<p class="eyebrow">'+esc(r.dia)+' · '+fechaCorta(fecha)+'</p>';
  h += '<h1 class="big">'+(desdeEntreno ? "Entrenamiento listo" : esc(r.titulo))+'</h1>';

  var mejoras = 0, iguales = 0, totalHoy = 0, totalAntes = 0;
  var filas = '';
  for(var i=0;i<r.ex.length;i++){
    var ex = r.ex[i], u = unidad(ex);
    var hoyS = reg.ex[ex.id] || [];
    var ant = ultima(ex.id, fecha);
    var antS = ant ? ant.series : [];
    var tH = suma(hoyS), tA = suma(antS);
    totalHoy += tH; totalAntes += tA;
    var dif = tH - tA;
    var estado = !ant ? '<span class="pill">Primera vez</span>'
      : dif > 0 ? '<span class="pill ok">+'+dif+' '+u+'</span>'
      : '<span class="pill eq">Igual</span>';
    if(ant){ if(dif > 0) mejoras++; else iguales++; }
    filas += '<div class="cmp"><div class="hd"><b>'+esc(ex.n)+'</b>'+estado+'</div>'
      + '<div class="vs">'
      + '<div class="c"><span>Entrenamiento anterior</span><b class="tab">'+(antS.length ? antS.join(" · ") : "—")+'</b><small>'+(ant ? "total "+tA+" "+u : "sin registro")+'</small></div>'
      + '<div class="ar" aria-hidden="true">→</div>'
      + '<div class="c now"><span>Hoy</span><b class="tab">'+(hoyS.length ? hoyS.join(" · ") : "—")+'</b><small>total '+tH+' '+u+'</small></div>'
      + '</div></div>';
  }

  h += '<div class="kpis">'
    + '<div class="kpi"><p>Ejercicios</p><b class="tab">'+r.ex.length+'</b><p>completados</p></div>'
    + '<div class="kpi k2"><p>Mejoraste en</p><b class="tab">'+mejoras+'</b><p>ejercicios</p></div>'
    + '<div class="kpi k3"><p>Repeticiones</p><b class="tab">'+totalHoy+' <small>'+(totalAntes ? (totalHoy-totalAntes >= 0 ? "+"+(totalHoy-totalAntes) : (totalHoy-totalAntes)) : "")+'</small></b><p>sumando todo</p></div>'
    + '</div>';

  h += '<div class="card sec"><h2 class="h2">Antes y ahora</h2>'+filas+'</div>';
  h += '<div class="foot"><button class="btn full" data-close="1">Listo</button></div>';
  view.innerHTML = h;
}

/* --- Calendario --- */
function renderCal(){
  var y = calRef.getFullYear(), m = calRef.getMonth();
  var first = new Date(y, m, 1), inicio = (first.getDay()+6)%7;
  var dias = new Date(y, m+1, 0).getDate();
  var hoyI = hoyISO();

  var h = '';
  h += '<p class="eyebrow">Registro</p><h1 class="big">Calendario</h1>';
  h += '<div class="card cal"><div class="calh">'
    + '<button class="ib" data-mes="-1" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>'
    + '<b>'+MESES[m]+' '+y+'</b>'
    + '<button class="ib" data-mes="1" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>'
    + '</div><div class="grid7">';
  var dh = ["L","M","M","J","V","S","D"];
  for(var i=0;i<7;i++) h += '<div class="dh">'+dh[i]+'</div>';
  for(var b=0;b<inicio;b++) h += '<div class="dc out"></div>';

  var hechos = 0, perdidos = 0, pend = 0;
  for(var d=1; d<=dias; d++){
    var fecha = new Date(y, m, d), iso = ymd(fecha), dow = fecha.getDay();
    var esRut = !!ROUTINES[dow], hay = !!S.log[iso];
    var cls = "dc", marca = "";
    if(hay){ cls += " done"; marca = "✓"; hechos++; }
    else if(esRut && iso < hoyI){ cls += " miss"; marca = "✕"; perdidos++; }
    else if(esRut){ cls += " train"; if(iso >= hoyI) pend++; }
    if(iso === hoyI) cls += " today";
    h += '<button class="'+cls+'" data-dia="'+iso+'"'+(hay?'':' disabled')+' aria-label="'+d+' de '+MESES[m]+(hay?", completado":(esRut?", rutina":""))+'">'
       + '<span class="d">'+d+'</span>'+(marca ? '<span class="m">'+marca+'</span>' : '')+'</button>';
  }
  h += '</div><div class="leg">'
    + '<span><i style="background:rgba(34,197,94,.3);border-color:#22C55E"></i>Hecho</span>'
    + '<span><i style="background:var(--acs);border-color:var(--ac)"></i>No se hizo</span>'
    + '<span><i style="background:var(--bg3)"></i>Toca rutina</span>'
    + '</div></div>';

  h += '<div class="kpis">'
    + '<div class="kpi k2"><p>Completados</p><b class="tab">'+hechos+'</b><p>este mes</p></div>'
    + '<div class="kpi"><p>Sin hacer</p><b class="tab">'+perdidos+'</b><p>días de rutina</p></div>'
    + '<div class="kpi k3"><p>Por delante</p><b class="tab">'+pend+'</b><p>pendientes del mes</p></div>'
    + '</div>';
  h += '<p class="sm mut sec">Toca un día con chulo para ver qué hiciste.</p>';
  view.innerHTML = h;
}

/* --- Récords --- */
function renderRec(){
  var h = '<p class="eyebrow">Kaizen</p><h1 class="big">Mis topes</h1>';
  h += '<p class="lede">Cada número es la mejor marca que has hecho en esa serie. La próxima vez solo puedes igualarla o superarla.</p>';
  var ords = [2,3,4,6,0], vistos = {}, algo = false;
  for(var j=0;j<ords.length;j++){
    var r = ROUTINES[ords[j]], filas = '';
    for(var i=0;i<r.ex.length;i++){
      var ex = r.ex[i], t = tope(ex.id), u = unidad(ex);
      var comp = (ex.id === "sentadillas" && vistos[ex.id]) ? '<small>mismo tope que el miércoles</small>' : '';
      vistos[ex.id] = true;
      if(t.length) algo = true;
      filas += '<button type="button" class="rec" data-verex="'+ex.id+'" aria-label="Ver cómo se hace: '+esc(ex.n)+'"><div class="nm">'+esc(ex.n)+comp+'</div>'
        + '<div class="vl">'+(t.length ? t.join(" · ") : "—")+'<small>'+(t.length ? suma(t)+" "+u+" en total" : "sin registro")+'</small></div>'
        + '<span class="xmc">'+IC.chr+'</span></button>';
    }
    h += '<div class="card sec"><div class="row"><h2 class="h2">'+esc(r.titulo)+'</h2><span class="chip">'+r.dia+'</span></div><div style="margin-top:10px">'+filas+'</div></div>';
  }
  if(!algo) h += '<p class="sm mut sec">Todavía no hay topes. Se llenan solos con tu primer entrenamiento.</p>';
  view.innerHTML = h;
}

function renderSheet(){
  if(!SH){ shEl.innerHTML = ""; return; }
  var pan = shEl.querySelector(".panel"), sc = pan ? pan.scrollTop : 0;
  var cuerpo = SH.pg === "ejercicio" ? pgEjercicio()
             : SH.pg === "perfil" ? pgPerfil()
             : SH.pg === "tema" ? pgTema()
             : SH.pg === "datos" ? pgDatos()
             : SH.pg === "borrar" ? pgBorrar()
             : pgMenu();
  shEl.innerHTML = '<div class="sheet" data-fondo="1"><div class="panel" role="dialog" aria-modal="true" aria-label="'+(SH.pg === "ejercicio" ? "Cómo se hace el ejercicio" : "Ajustes")+'">'+cuerpo+'</div></div>';
  var p = shEl.querySelector(".panel"); if(p) p.scrollTop = sc;
}
function cab(t){
  return '<div class="row"><div class="xbk"><button type="button" class="ib2" data-setpg="" aria-label="Volver a Ajustes">'+IC.chl+'</button><h2 class="h2">'+t+'</h2></div>'
    + '<button type="button" class="btn sm" data-shclose="1">Listo</button></div>';
}
function pgMenu(){
  var n = 0; for(var k in S.log) n++;
  var it = [
    ["perfil", IC.user, "Tu perfil", (S.prof.name ? S.prof.name+" · "+AVN[curAv()-1] : "Elige tu personaje y tu nombre")],
    ["tema", IC.moon, "Apariencia", (S.theme === "light" ? "Modo claro" : S.theme === "dark" ? "Modo oscuro" : "Sigue al sistema")],
    ["datos", IC.data, "Tus datos", n+" entrenamiento"+(n===1?"":"s")+" guardado"+(n===1?"":"s")],
    ["borrar", IC.trash, "Empezar de cero", "Borrar entrenamientos y topes"]
  ];
  var h = '<div class="row"><h2 class="h2">Ajustes</h2><button type="button" class="btn sm g" data-shclose="1">Cerrar</button></div><ul class="xmenu">';
  for(var i=0;i<it.length;i++){
    h += '<li><button type="button" class="xmi" data-setpg="'+it[i][0]+'"><span class="xmic">'+it[i][1]+'</span>'
      + '<span class="xmt"><b>'+it[i][2]+'</b><span>'+esc(it[i][3])+'</span></span><span class="xmc">'+IC.chr+'</span></button></li>';
  }
  h += '</ul><p class="sm mut" style="margin-top:22px;text-align:center">Mi entrenamiento · NicoClavijo</p>';
  return h;
}
function pgEjercicio(){
  var ex = exInfo(SH.ex), u = unidad(ex), t = tope(ex.id), ult = ultima(ex.id, null);
  var h = '<div class="row"><h2 class="h2">'+esc(ex.n)+'</h2><button type="button" class="btn sm g" data-shclose="1">Cerrar</button></div>';
  if(ex.img){
    h += '<div class="ph tiene" style="margin-top:16px"><img src="'+ex.img+'" alt="Cómo se hace: '+esc(ex.n)+'"></div>';
  } else {
    h += '<div class="ph" style="margin-top:16px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M3 17l5-4 4 3 3-2 6 5"></path></svg>'
       + '<span>Todavía no hay imagen de este ejercicio</span></div>';
  }
  h += '<div class="topbox">'
    + '<div class="b hot"><span>Tope actual</span><b class="tab">'+(t.length ? t.join(" · ") : "—")+'</b><span style="text-transform:none;letter-spacing:0;font-weight:600">'+u+' por serie</span></div>'
    + '<div class="b"><span>Última vez</span><b class="tab">'+(ult ? ult.series.join(" · ") : "—")+'</b><span style="text-transform:none;letter-spacing:0;font-weight:600">'+(ult ? fechaCorta(ult.fecha) : "sin registro")+'</span></div>'
    + '</div>';
  return h;
}
function pgPerfil(){
  var h = cab("Tu perfil") + '<p class="eyebrow" style="margin-top:22px">Tu personaje</p><div class="avs" role="radiogroup" aria-label="Tu personaje">';
  for(var a=1;a<=6;a++){
    var on = curAv() === a;
    h += '<button type="button" class="avp'+(on?" on":"")+'" role="radio" aria-checked="'+on+'" data-av="'+a+'" aria-label="'+AVN[a-1]+'">'
      + avHtml(a, 76) + '<span class="sm">' + (on ? '<span class="ck">'+IC.ok+'</span>' : '') + AVN[a-1] + '</span></button>';
  }
  h += '</div><p class="eyebrow" style="margin-top:24px">Cómo quieres que te llame</p>'
    + '<div class="row" style="margin-top:10px;gap:8px"><input class="na" type="text" id="nm" maxlength="24" placeholder="Tu nombre o apodo" value="'+esc(S.prof.name)+'" aria-label="Cómo quieres que te llame" autocomplete="off"><button class="btn" data-savename="1">Guardar</button></div>'
    + '<p class="sm mut" style="margin-top:8px">Aparece en el saludo de arriba.</p>';
  return h;
}
function pgTema(){
  var modo = S.theme || "auto";
  return cab("Apariencia")
    + '<p class="sm mut" style="margin-top:18px">El interruptor de arriba cambia rápido entre claro y oscuro. Aquí eliges si prefieres que siga al sistema.</p>'
    + '<div class="seg">'
    + '<button data-tema="auto" class="'+(modo==="auto"?"on":"")+'">Sistema</button>'
    + '<button data-tema="light" class="'+(modo==="light"?"on":"")+'">Claro</button>'
    + '<button data-tema="dark" class="'+(modo==="dark"?"on":"")+'">Oscuro</button>'
    + '</div>';
}
function pgDatos(){
  var n = 0; for(var k in S.log) n++;
  return cab("Tus datos")
    + '<p class="sm mut" style="margin-top:18px">Tienes '+n+' entrenamiento'+(n===1?"":"s")+' guardado'+(n===1?"":"s")+' en este dispositivo. Para pasarlos a otro, copia el código y pégalo allá.</p>'
    + '<textarea class="na" id="code" readonly aria-label="Código de respaldo" style="margin-top:12px">'+esc(exportar())+'</textarea>'
    + '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" data-copy="1">Copiar código</button><button class="btn g sm" data-import="1">Pegar código</button></div>'
    + '<div id="msg" class="sm mut" style="margin-top:8px">'+esc(SH.msg || "")+'</div>';
}
function pgBorrar(){
  var h = cab("Empezar de cero")
    + '<p class="sm mut" style="margin-top:18px">Esto borra todos los entrenamientos y todos los topes. Tu personaje y tu nombre se quedan. No se puede deshacer.</p>'
    + '<div id="zona" style="margin-top:16px">';
  if(SH.conf){
    h += '<p class="sm" style="color:var(--act);font-weight:700">¿Seguro? Vas a perder todas tus marcas.</p>'
      + '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" data-reset2="1">Sí, borrar todo</button><button class="btn g sm" data-setpg="borrar">Cancelar</button></div>';
  } else {
    h += '<button class="btn g sm" data-reset="1">Borrar todo</button>';
  }
  return h + '</div>';
}
function exportar(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify({v:1, log:S.log, prof:S.prof})))); }catch(e){ return ""; }
}
function importar(code){
  try{
    var o = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!o || !o.log) return false;
    for(var f in o.log){ S.log[f] = o.log[f]; }
    if(o.prof) S.prof = {av:o.prof.av || 1, name:o.prof.name || ""};
    save(); return true;
  }catch(e){ return false; }
}

/* ---------- perfil y cabecera ---------- */
var AVN = ["Nico","Manu","Gatito","Cris","Mapi","Conejón"];
var topEl = document.getElementById("top");
function curAv(){ var n = +S.prof.av; return (n >= 1 && n <= 6) ? n : 1; }
function avHtml(n, px){
  var u = (window.AVS || [])[n-1];
  var ini = esc((S.prof.name || "N").charAt(0).toUpperCase());
  return '<span class="av" style="width:'+px+'px;height:'+px+'px">'
    + (u ? '<img src="'+u+'" alt="" width="'+px+'" height="'+px+'">'
         : '<span style="font-size:'+Math.round(px*0.4)+'px">'+ini+'</span>')
    + '</span>';
}
function saludo(){ var h = new Date().getHours(); return h < 12 ? "Buenos días" : (h < 19 ? "Buenas tardes" : "Buenas noches"); }
function esDark(){ return S.theme === "dark" || (!S.theme && window.matchMedia("(prefers-color-scheme: dark)").matches); }
function renderTop(){
  var nm = S.prof.name;
  topEl.innerHTML = '<button type="button" class="who" data-perfil="1" aria-label="Abrir tu perfil">'
    + avHtml(curAv(), 56)
    + '<span class="tx"><span class="g">'+saludo()+'</span>'
    + (nm ? '<span class="n">'+esc(nm)+'</span>' : '<span class="n ask">¿Cómo te llamo?</span>')
    + '</span></button>'
    + '<button class="sw" type="button" data-tema2="1" role="switch" aria-checked="'+esDark()+'" aria-label="Cambiar entre modo claro y oscuro">'
    + '<span class="k"></span>'
    + '<svg class="s1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>'
    + '<svg class="s2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"></path></svg>'
    + '</button>'
    + '<button class="ib2" type="button" data-ajustes="1" aria-label="Abrir ajustes">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15.4a2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.6-2l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.6V3a2 2 0 1 1 4 0v.6a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.2z"></path></svg>'
    + '</button>';
  var t = topEl.querySelector(".sw"), g = topEl.querySelector(".ib2");
  if(t && g){ var box = document.createElement("div"); box.className = "tools"; topEl.appendChild(box); box.appendChild(t); box.appendChild(g); }
}

/* ---------- tema ---------- */
function aplicarTema(){
  var root = document.documentElement;
  if(S.theme) root.setAttribute("data-theme", S.theme); else root.removeAttribute("data-theme");
  renderTop();
}

/* ---------- eventos ---------- */
document.addEventListener("click", function(e){
  if(e.target.dataset && e.target.dataset.fondo){ SH = null; renderSheet(); return; }
  var t = e.target.closest ? e.target.closest("button") : null;
  if(!t) return;

  if(t.dataset.tab){ W = null; tab = t.dataset.tab; marcarNav(); render(); return; }
  if(t.dataset.start){ startEntreno(+t.dataset.start); return; }
  if(t.dataset.cancel){ W = null; render(); return; }
  if(t.dataset.close){ W = null; tab = "hoy"; marcarNav(); render(); return; }
  if(t.dataset.go === "resumen"){ W = null; renderResumen(t.dataset.f, false); return; }
  if(t.dataset.dia){ W = null; renderResumen(t.dataset.dia, false); return; }
  if(t.dataset.mes){ calRef = new Date(calRef.getFullYear(), calRef.getMonth() + (+t.dataset.mes), 1); renderCal(); return; }
  if(t.dataset.ajustes){ SH = {pg:""}; renderSheet(); return; }
  if(t.dataset.verex){ SH = {pg:"ejercicio", ex:t.dataset.verex}; renderSheet(); return; }
  if(t.dataset.setpg !== undefined){ SH = {pg:t.dataset.setpg}; renderSheet(); return; }
  if(t.dataset.shclose){ SH = null; renderSheet(); return; }
  if(t.dataset.tema){ S.theme = t.dataset.tema === "auto" ? null : t.dataset.tema; save(); aplicarTema(); renderSheet(); return; }
  if(t.dataset.tema2){ S.theme = esDark() ? "light" : "dark"; save(); aplicarTema(); renderSheet(); return; }
  if(t.dataset.perfil){ SH = {pg:"perfil"}; renderSheet(); return; }
  if(t.dataset.av){ S.prof.av = +t.dataset.av; save(); renderTop(); renderSheet(); return; }
  if(t.dataset.savename){
    var inp = document.getElementById("nm");
    S.prof.name = (inp ? inp.value : "").trim().slice(0, 24);
    save(); renderTop(); renderSheet(); return;
  }

  if(W && !W.fin){
    var r = ROUTINES[W.dow], ex = r.ex[W.i];
    if(t.dataset.step){
      var i = +t.dataset.i, el = document.getElementById("s"+i);
      var v = parseInt(el.value, 10); if(isNaN(v)) v = 0;
      v = Math.max(0, v + (+t.dataset.step));
      el.value = v; W.series[ex.id][i] = v; return;
    }
    if(t.dataset.add){
      leerInputs();
      var arr = W.series[ex.id];
      var tp = tope(ex.id);
      arr.push(tp[arr.length] != null ? tp[arr.length] : 0);
      W.err = ""; render(); return;
    }
    if(t.dataset.rm){ leerInputs(); W.series[ex.id].splice(+t.dataset.rm, 1); W.err = ""; render(); return; }
    if(t.dataset.prev){ leerInputs(); W.i--; W.err = ""; render(); return; }
    if(t.dataset.next){
      if(!validarYGuardarPaso()){ render(); return; }
      if(W.i === r.ex.length-1) terminar(); else { W.i++; render(); }
      return;
    }
  }

  if(t.dataset.copy){
    var ta = document.getElementById("code");
    var msg = document.getElementById("msg");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){ msg.textContent = "Código copiado."; },
        function(){ ta.removeAttribute("readonly"); ta.select(); msg.textContent = "Selecciona el texto y cópialo a mano."; });
    } else { ta.removeAttribute("readonly"); ta.select(); msg.textContent = "Selecciona el texto y cópialo a mano."; }
    return;
  }
  if(t.dataset.import){
    var ta2 = document.getElementById("code"), msg2 = document.getElementById("msg");
    if(ta2.dataset.modo === "edit"){
      if(importar(ta2.value)){ SH = {pg:"datos", msg:"Datos importados."}; renderTop(); renderSheet(); render(); return; }
      else { msg2.textContent = "Ese código no se pudo leer. Revisa que esté completo."; }
    } else {
      ta2.removeAttribute("readonly"); ta2.value = ""; ta2.dataset.modo = "edit"; ta2.focus();
      t.textContent = "Importar ahora";
      msg2.textContent = "Pega aquí el código del otro dispositivo y toca Importar ahora.";
    }
    return;
  }
  if(t.dataset.reset){ SH = {pg:"borrar", conf:true}; renderSheet(); return; }
  if(t.dataset.reset2){ S.log = {}; save(); SH = {pg:""}; renderSheet(); render(); return; }
});

function leerInputs(){
  if(!W) return;
  var ex = ROUTINES[W.dow].ex[W.i], arr = W.series[ex.id];
  for(var i=0;i<arr.length;i++){
    var el = document.getElementById("s"+i);
    if(el){ var v = parseInt(el.value, 10); arr[i] = isNaN(v) ? 0 : Math.max(0, v); }
  }
}
document.addEventListener("input", function(e){
  if(!W || W.fin || !e.target.id || e.target.id.charAt(0) !== "s") return;
  var ex = ROUTINES[W.dow].ex[W.i], i = +e.target.dataset.i;
  var t = tope(ex.id), min = t[i] != null ? t[i] : 0;
  var v = parseInt(e.target.value, 10);
  e.target.classList.toggle("bad", !isNaN(v) && v < min);
});

function marcarNav(){
  var bs = document.querySelectorAll(".nav button");
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle("on", bs[i].dataset.tab === tab);
}

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && SH){ SH = null; renderSheet(); }
  if(e.key === "Enter" && e.target && e.target.id === "nm"){
    e.preventDefault();
    S.prof.name = e.target.value.trim().slice(0, 24);
    save(); renderTop(); renderSheet();
  }
});

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", aplicarTema);

load();
aplicarTema();
render();
</script>

<script>
(function(){
  var dp = null, box = document.getElementById("inst"), txt = document.getElementById("itxt"),
      go = document.getElementById("instgo"), no = document.getElementById("instno");
  function instalada(){
    try{ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }catch(e){ return false; }
  }
  function oculto(){ try{ return localStorage.getItem("nc-inst-no") === "1"; }catch(e){ return false; } }
  function esIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent); }
  function mostrar(){
    if(instalada() || oculto()) return;
    document.body.style.paddingBottom = "210px";
    box.hidden = false;
  }
  function cerrar(){
    box.hidden = true; document.body.style.paddingBottom = "";
    try{ localStorage.setItem("nc-inst-no", "1"); }catch(e){}
  }
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); dp = e; mostrar(); });
  if(esIOS() && !instalada() && !oculto()){
    txt.textContent = "Toca Compartir y luego \u201cAgregar a inicio\u201d para tenerla como app.";
    go.hidden = true;
    setTimeout(mostrar, 900);
  }
  go.addEventListener("click", function(){
    if(!dp){ cerrar(); return; }
    dp.prompt();
    dp.userChoice.then(function(){ dp = null; box.hidden = true; document.body.style.paddingBottom = ""; });
  });
  no.addEventListener("click", cerrar);
  window.addEventListener("appinstalled", function(){ box.hidden = true; document.body.style.paddingBottom = ""; });
})();

/* Aviso de actualización: igual al de Mi rendimiento */
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      function avisar(w){
        var t = document.getElementById("tt"); if(!t) return;
        t.innerHTML = '<div class="toast" role="status" style="display:flex;gap:12px;align-items:center">Hay una actualización <button type="button" class="btn sm" id="updb">Actualizar</button></div>';
        document.getElementById("updb").onclick = function(){ w.postMessage("skip"); };
      }
      if(reg.waiting && navigator.serviceWorker.controller) avisar(reg.waiting);
      reg.addEventListener("updatefound", function(){
        var w = reg.installing;
        if(w) w.addEventListener("statechange", function(){
          if(w.state === "installed" && navigator.serviceWorker.controller) avisar(w);
        });
      });
      document.addEventListener("visibilitychange", function(){ if(!document.hidden) reg.update().catch(function(){}); });
    }).catch(function(){});
    var ya = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){ if(ya) return; ya = true; location.reload(); });
  });
}
</script>
